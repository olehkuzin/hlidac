# Illness groups (D50, split into 20 groups by D51): every cancer group in the hospital data gets its
# own check-in questionnaire. Read by src/hlidac/groups.py, which builds
# data/questionnaires/symptoms-group-*.json and data/plans/symptoms-group-*.plan.yaml from this file
# (`uv run python -m hlidac.groups build`) and assigns patients to a group by the ICD-10 codes of
# their hospital `Condition`s in IRIS (read-only, never shown or stored outside IRIS).
#
# Every group questionnaire = the shared core items of symptoms-demo-v1.json (fever, chills,
# unwell, nausea, vomiting, diarrhoea, so CTCAE grading and the UKONS rules work unchanged) + the
# group's own items below + the free-text item. The group items are not graded by CTCAE: a "yes"
# raises a routine review by the rule `group-symptom-reported` (rules-demo-v1.yaml), a red-flag item
# is asked first with buttons and raises a review by `red-flag-present`, and "Nevím" or no answer
# counts as missing (insufficient information). Nothing here can lower urgency.
#
# Verified against the real hospital data in IRIS (D51, counts only, docs/illness-groups.md): every
# one of the 325 patients with an ICD-10 cancer code and every one of the 73 patients with dose
# records falls in exactly one group, and every group has patients.
#
# The ten original group ids (breast, digestive, lung, urological, gynaecological, haematological,
# head_neck, brain, skin, sarcoma) keep their questionnaire URLs, so plans already seeded in IRIS
# stay valid; D51 narrowed them and split off the other ten.
#
# Written by the team for the demo. The team (Nazar, 17 Oct 2026) reports that FN Motol agreed to
# this demo use; it is not a clinical sign-off of each item. No patient data.
content_id: groups-demo
version: "1"
approval: "DEMO — použití pro demo odsouhlaseno FN Motol (podle týmu, 17. 10. 2026)"
approved_by: null
source_ref: >-
  Team-written demo content (Rakathon 2026, team VI-KA); demo use agreed with FN Motol as reported
  by the team on 17 Oct 2026. ICD-10 blocks from WHO ICD-10 chapter II (Neoplasms, C00-D48); D38
  (uncertain behaviour, middle ear, respiratory and intrathoracic organs) joins the lung group.
  Group symptoms are common treatment side effects and warning signs per tumour site, written in
  plain Czech by the team; not a clinical sign-off of each item.
# Patients whose codes match no group keep the general demo questionnaire.
fallback_questionnaire: {url: "urn:hlidac:questionnaire:demo", version: "1"}

