# Red-flag phrases for free-text check-ins (WP22, rewritten D56), checked by src/hlidac/redflags.py.
# No patient data. Written by the team from public oncology triage guidance; FN Motol agreed that
# the team writes the demo's clinical content (D51). DEMO — čeká na schválení FN Motol.
#
# Two levels (D56):
# - `urgent`: only the truly critical, life-threatening statements. A hit opens the urgent screen
#   at once and alerts the nurse; nothing waits for a question (PRINCIPLES.md principle 6).
# - `review`: worrying but not by itself critical. A hit makes the report at least a nurse review
#   (never "no escalation") and the questions decide the rest; e.g. "mám horečku" waits for the
#   thermometer (D54), whose reading still makes it urgent.
# A hit can only RAISE urgency (principle 2). Matching ignores case and diacritics ("nemuzu dychat"
# = "nemůžu dýchat") and starts at a word boundary, so a phrase may be a stem ("dušnost").

content_id: redflags-demo
version: "2"
approval: "DEMO — čeká na schválení FN Motol"
