[project]
name = "hlidac"
version = "0.1.0"
description = "Digital side-effect watchdog with InterSystems IRIS (Rakathon 2026, praha-03)"
authors = [{ name = "Team VI-KA" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "intersystems-irispython>=5.4.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mlx-whisper>=0.4 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hlidac = "hlidac:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # shared helpers (factories) for tests in subfolders

[tool.ruff]
line-length = 100
